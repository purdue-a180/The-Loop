<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#2f5410">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="loop">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>loop · 180DC Purdue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: charcoal brand band (logo, greeting, counts) over one 820px column. Directors: mood pet + "your day" grouped list. Leadership: board pet, director rows with mini pets, live notifications. */
:root{
  /* The Loop: white canvas, 180DC logo green (#72A335) as the brand, a deep green for text-weight accents */
  --bg:#f7f9f5; --surface:#ffffff; --sunk:#f1f5ec; --line:#e4eadd; --line-strong:#cfd9c4;
  --ink:#15200f; --muted:#5b6852; --faint:#9aa691;
  --brand:#72a335; --brand-deep:#3f6d14; --brand-ink:#ffffff; --band:#2f5410; --band-ink:#ffffff; --band-muted:#d6e6c4; --band-line:rgb(255 255 255 / .16); --band-tile:rgb(255 255 255 / .1);
  --accent:#4a7f17; --accent-ink:#ffffff; --accent-soft:#eef6e4;
  --ok:#3f7f17; --warn:#b36b00; --warn-soft:#fdf2df; --bad:#c0392b; --bad-soft:#fde8e5; --blue:#2f6fb5; --blue-soft:#e6effa;
  --wa:#1f8f4e; --pet-dark:#1d2a12; --cheek:#f2a7a0;
  --shadow:0 1px 2px rgb(30 50 10 / .05),0 8px 24px rgb(30 50 10 / .06);
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Figtree",system-ui,sans-serif;
  --r:14px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:.98rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.86rem}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:600;font-size:.88rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.text{border:0;background:none;padding:4px 2px;color:var(--muted);font-weight:500}
.btn.text:hover{color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.wabtn{background:var(--wa);border-color:var(--wa);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}
label.f{display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-weight:500}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* band */
.band{background:var(--band);color:var(--band-ink);border-bottom:4px solid var(--brand);position:relative;overflow:hidden}
.band::after{content:"";position:absolute;right:-120px;top:-140px;width:420px;height:420px;border-radius:50%;border:56px solid var(--brand);opacity:.07;pointer-events:none}
.band-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 26px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;align-items:center;position:relative;z-index:1}
.band img{height:100px;width:auto;display:block}
.hero{display:grid;gap:8px;min-width:0}
.hero .k{font-size:.74rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.hero h1{color:var(--band-ink);font-size:1.95rem;line-height:1.1}
.hero .lede{color:var(--band-muted);font-size:.95rem}
.tiles{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.tile{background:var(--band-tile);border:1px solid var(--band-line);border-radius:10px;padding:6px 12px;display:grid;line-height:1.2;min-width:78px}
.tile b{font:700 1.35rem var(--display);font-variant-numeric:tabular-nums;color:var(--band-ink)}
.tile span{font-size:.72rem;color:var(--band-muted)}
.tile.bad b{color:#ff8f80} .tile.warn b{color:#f3bd62} .tile.acc b{color:var(--brand)}
.bandact{display:flex;gap:6px;align-self:start;align-items:center}
.ib{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--band-line);background:var(--band-tile);color:var(--band-ink);display:grid;place-items:center;padding:0}
.ib:hover{border-color:var(--brand)}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib .dotn{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:99px;background:#e5533f;color:#fff;font:700 .68rem/18px var(--body);padding:0 5px}
.bandlink{background:none;border:0;color:var(--band-muted);font-size:.8rem;padding:4px}
.bandlink:hover{color:var(--band-ink)}
@media (max-width:640px){
  .band-in{grid-template-columns:1fr;gap:14px;padding-block:16px 20px}
  .band img{height:72px}
  .bandact{position:absolute;top:16px;right:max(16px,env(safe-area-inset-right,0px))}
  .hero h1{font-size:1.5rem}
  .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .tile{min-width:0;padding:6px 8px}.tile span{font-size:.66rem}
}

#main{display:grid;gap:20px}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.dash>.col{display:grid;gap:16px;min-width:0}
.dash>.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
.dash.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:980px){.dash,.dash.even{grid-template-columns:1fr}.dash>.side{position:static;order:-1}}
.narrow{max-width:860px;width:100%}
.petcard.side{grid-template-columns:1fr;justify-items:center;text-align:center;padding:20px 18px 18px}
.petcard.side .speech::before{display:none}
.petcard.side .petmeta{width:100%}
.petcard.side .load{text-align:left}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.mini h3{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--body)}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;background:none;border:0;text-align:left;width:100%;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
button.mrow:hover .mt{color:var(--accent)}
.mrow .mt{font-size:.88rem;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mrow .ms{font-size:.74rem;color:var(--muted)}
.mrow .md{font-size:.78rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.mdot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-weight:700;color:#fff;background:var(--brand)}
.mdot.blocked{background:#d9962b}.mdot.added{background:var(--blue)}.mdot.comment,.mdot.status{background:var(--muted)}.mdot.due{background:var(--sunk);color:var(--ink)}
.mempty{font-size:.85rem;color:var(--muted);padding:4px 0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 72px;display:grid;gap:20px}
.kicker{font-size:.78rem;font-weight:600;color:var(--accent)}
.seg{display:inline-flex;background:var(--sunk);border-radius:99px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;border-radius:99px;padding:6px 14px;font-weight:600;font-size:.86rem;color:var(--muted);white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.seg .n{background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:.7rem;padding:0 6px;margin-left:5px}

/* pet */
.thought{position:relative;padding:18px 20px 18px 54px;border-radius:16px;background:var(--accent-soft);display:grid;gap:4px}
.thought::before{content:"\201C";position:absolute;left:16px;top:6px;font:700 3.2rem/1 var(--display);color:var(--brand)}
.thought .tk{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.thought p{font:600 1.15rem/1.35 var(--display);letter-spacing:-.01em;color:var(--ink);text-wrap:balance}
.petcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;box-shadow:0 1px 2px rgb(20 30 15 / .04),0 4px 14px rgb(20 30 15 / .04)}
.petbtn{background:none;border:0;padding:0;border-radius:50%}
.pet{display:block;transform-origin:50% 92%}
.speech{position:relative;background:var(--sunk);border-radius:12px;padding:10px 14px;font-size:.95rem;line-height:1.4}
.speech::before{content:"";position:absolute;left:-7px;top:18px;border:7px solid transparent;border-left:0;border-right-color:var(--sunk)}
.petmeta{display:grid;gap:8px;min-width:0}
.load{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.8rem;color:var(--muted)}
.load .track{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.load .track i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .6s}
.load .track i.heavy{background:#d9962b} .load .track i.over{background:var(--bad)}
.load b{color:var(--ink);font-weight:600}
@media (max-width:520px){.petcard{grid-template-columns:1fr;justify-items:center;text-align:center}.speech::before{display:none}.load{width:100%;text-align:left}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-10px) scale(.96,1.04)}55%{transform:translateY(0) scale(1.05,.95)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes jitter{0%,60%,100%{transform:translateX(0)}65%{transform:translateX(-3px)}70%{transform:translateX(3px)}75%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
@keyframes jump{0%{transform:translateY(0) rotate(0)}40%{transform:translateY(-22px) rotate(-12deg)}70%{transform:translateY(0) rotate(8deg) scale(1.06,.94)}100%{transform:translateY(0) rotate(0)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}40%{opacity:1}100%{opacity:0;transform:translate(6px,-10px)}}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:no-preference){
  .pet.m-calm,.pet.m-chill,.pet.m-rally{animation:bob 3.2s ease-in-out infinite}
  .pet.m-busy{animation:bob 1.3s ease-in-out infinite}
  .pet.m-thriving,.pet.m-proud{animation:bounce 1.3s ease-in-out infinite}
  .pet.m-worried{animation:sway 2.2s ease-in-out infinite}
  .pet.m-stressed{animation:jitter 1.6s linear infinite}
  .pet.m-sleepy{animation:breathe 4s ease-in-out infinite}
  .pet.celebrate{animation:jump .7s ease-out 2}
  .pet .eyes{transform-origin:60px 58px;animation:blink 5s infinite}
  .pet .zz{animation:zz 2.4s ease-in-out infinite}
  .pet .sp{animation:twinkle 1.4s ease-in-out infinite}
}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 2px rgb(20 30 15 / .04),0 4px 14px rgb(20 30 15 / .04)}
.list>*+*{border-top:1px solid var(--line)}
.group{display:grid;gap:8px}
.ghead{display:flex;align-items:baseline;gap:8px;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ghead.bad{color:var(--bad)} .ghead .c{font-weight:600;letter-spacing:0;text-transform:none;color:var(--faint)}
.item{display:grid}
.item.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.ihead{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 16px}
.ihead:hover{background:var(--sunk)}
.trash{border:0;background:none;color:var(--faint);padding:6px;border-radius:8px;display:grid;place-items:center;font:600 .78rem var(--body)}
.trash:hover{color:var(--bad);background:var(--bad-soft)}
.trash.armed{color:#fff;background:var(--bad);padding:6px 10px}
.iopen{background:none;border:0;text-align:left;padding:0;min-width:0}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;padding:0;flex:none;transition:transform .15s}
.check:hover{border-color:var(--brand);transform:scale(1.08)}
.check svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.check.on{background:var(--brand);border-color:var(--brand)}
.check.on svg{opacity:1}
.ititle{font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.item.done .ititle{color:var(--faint);text-decoration:line-through}
.isub{font-size:.8rem;color:var(--muted);margin-top:2px}
.st{font-size:.72rem;font-weight:600;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.st.doing{background:var(--blue-soft);color:var(--blue)} .st.blocked{background:var(--warn-soft);color:var(--warn)}
.due{font-size:.82rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.due.bad{color:var(--bad);font-weight:600} .due.warn{color:var(--warn);font-weight:600}
.ibody{padding:4px 16px 16px 52px;display:grid;gap:14px}
@media (max-width:500px){.ibody{padding-left:16px}}
.quote{font-size:.86rem;color:var(--muted);border-left:2px solid var(--line-strong);padding-left:10px}
.pills{display:inline-flex;gap:4px;flex-wrap:wrap}
.pills button{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:.82rem;font-weight:600;color:var(--muted)}
.pills button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.thread{display:grid;gap:10px}
.upd{font-size:.9rem;display:grid;gap:1px}
.upd .by{font-size:.75rem;color:var(--muted)}
.upd.lead .by{color:var(--accent);font-weight:600}
.upd p{white-space:pre-wrap;overflow-wrap:anywhere}
.compose{display:grid;gap:8px}
.compose .row{justify-content:flex-end}
.edit{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:12px;border-top:1px dashed var(--line)}
.edit input:not([type=date]){flex:1;min-width:180px}
.edit input[type=date]{width:auto}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:.9rem}
.quickadd{display:grid;grid-template-columns:auto minmax(0,1fr) 150px auto;gap:10px;align-items:center;padding:10px 16px;background:var(--surface)}
.quickadd input{border:0;padding:6px 0;background:transparent}
.quickadd input[type=date]{border:1px solid var(--line);padding:5px 8px;border-radius:8px}
.assignbar{grid-template-columns:auto minmax(0,1fr) 200px 150px auto;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.assignbar select{border:1px solid var(--line);padding:5px 8px;border-radius:8px}
@media (max-width:700px){.assignbar{grid-template-columns:auto minmax(0,1fr)}.assignbar select,.assignbar input[type=date],.assignbar button{grid-column:2}}
.quickadd .plus{width:24px;height:24px;border-radius:50%;border:2px dashed var(--line-strong);display:grid;place-items:center;color:var(--faint);font-weight:700;line-height:1}
@media (max-width:520px){.quickadd{grid-template-columns:auto minmax(0,1fr) auto}.quickadd input[type=date]{grid-column:2;grid-row:2;justify-self:start;width:auto;font-size:.82rem}.quickadd button{grid-column:3;grid-row:1}}

/* leadership rows */
.drow{display:grid;grid-template-columns:auto minmax(0,1fr) 150px 120px;gap:14px;align-items:center;padding:12px 16px;width:100%;background:none;border:0;text-align:left}
.drow:hover{background:var(--sunk)}
.drow .name{font-weight:600}
.drow .who{font-size:.82rem;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.barlbl{font-size:.75rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.flags{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:620px){.drow{grid-template-columns:auto minmax(0,1fr) auto}.drow .prog{grid-column:2/-1;order:3}}
.tag{font-size:.74rem;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.ok{color:var(--ok)} .tag.plain{background:var(--sunk);color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.form3{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1fr);gap:10px;align-items:end}
@media (max-width:620px){.form3{grid-template-columns:1fr}}
.qitem{padding:14px 16px;display:grid;gap:10px}
.qfields{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) minmax(0,1fr);gap:8px}
@media (max-width:620px){.qfields{grid-template-columns:1fr}}
.drop{border:2px dashed var(--line-strong);border-radius:12px;padding:26px 16px;display:grid;gap:4px;justify-items:center;text-align:center;cursor:pointer;background:var(--bg)}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--accent-soft)}
.drop .up{width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.1rem;margin-bottom:6px}
.loaded{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--accent-soft)}
.loaded .fi{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700}
.loaded .fn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* login + claim */
.gate{max-width:400px;margin:4vh auto 0;display:grid;gap:16px}
.gate .card{gap:12px}
.err{color:var(--bad);font-size:.85rem}
.opt{display:grid;gap:2px;text-align:left;padding:14px 16px;background:none;border:0;width:100%}
.opt:hover,.opt[aria-pressed="true"]{background:var(--accent-soft)}
.opt small{color:var(--muted);font-size:.82rem}

/* preview */
.previewbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);font-size:.88rem}
.frame{border:2px dashed var(--line-strong);border-radius:16px;padding:20px;display:grid;gap:18px;background:var(--bg)}
@media (max-width:500px){.frame{padding:12px}}
.preview .compose,.preview .quickadd,.preview .edit,.preview .check,.preview .pills{opacity:.5;pointer-events:none}

/* notifications */
.feed{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:min(380px,calc(100% - 24px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;z-index:40;box-shadow:0 16px 40px rgb(0 0 0 / .22)}
.feed header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}

<script>
/* ---------- API + data layer (replaces the Claude artifact runtime) ---------- */
const API={async call(path,body,signal){
  const r=await fetch(path,{method:body?"POST":"GET",headers:body?{"content-type":"application/json"}:{},body:body?JSON.stringify(body):undefined,credentials:"same-origin",signal});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw Object.assign(new Error(j.error||"Request failed"),{status:r.status,code:j.code||(r.status===401?"not_granted":"upstream_error"),message:j.error||"Request failed"});
  return j;
}};
let ME=null;
const Store=(()=>{
  const subs=new Map();let inflight=false,again=false;
  const snapDoc=(path,data)=>({id:path.split("/").pop(),exists:data!=null,data:()=>data==null?undefined:data,metadata:{fromCache:false,hasPendingWrites:false}});
  async function batch(ops){return (await API.call("/api/db",{ops})).results||[]}
  async function poll(){
    if(inflight){again=true;return}
    if(!subs.size)return;
    inflight=true;
    try{
      const keys=[...subs.keys()];
      const res=await batch(keys.map(k=>{const s=subs.get(k);return {op:s.kind==="doc"?"get":"list",path:s.path}}));
      keys.forEach((k,i)=>{
        const s=subs.get(k);if(!s)return;const r=res[i]||{};const sig=JSON.stringify(r);if(sig===s.last)return;s.last=sig;
        if(s.kind==="doc"){const snap=snapDoc(s.path,r.data??null);s.cbs.forEach(c=>{try{c.next(snap)}catch(e){console.error(e)}})}
        else{const docs=(r.docs||[]).sort((a,b)=>a.id.localeCompare(b.id)).map(d=>snapDoc(s.path+"/"+d.id,d.data));
          const q={docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]};
          s.cbs.forEach(c=>{try{c.next(q)}catch(e){console.error(e)}})}
      });
    }catch(e){if(e.status===401)location.reload()}
    finally{inflight=false;if(again){again=false;poll()}}
  }
  function kick(){clearTimeout(kick.t);kick.t=setTimeout(poll,100)}
  setInterval(()=>{if(document.visibilityState==="visible")poll()},4000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")poll()});
  function subscribe(kind,path,next,error){
    const k=kind+":"+path;let s=subs.get(k);if(!s){s={kind,path,cbs:new Set(),last:null};subs.set(k,s)}else s.last=null;
    const cb={next,error};s.cbs.add(cb);kick();
    return()=>{s.cbs.delete(cb);if(!s.cbs.size)subs.delete(k)};
  }
  async function write(op){const [r]=await batch([op]);if(!r||r.error)throw {code:r?.error||"unavailable",message:r?.message||"Write failed"};kick();return r}
  function doc(path){return {id:path.split("/").pop(),path,
    get:async()=>{const [r]=await batch([{op:"get",path}]);return snapDoc(path,r?.data??null)},
    set:d=>write({op:"set",path,data:d}),update:d=>write({op:"update",path,data:d}),delete:()=>write({op:"delete",path}),
    onSnapshot:(n,e)=>subscribe("doc",path,n,e),collection:p=>col(path+"/"+p)}}
  function col(path){return {path,
    doc:id=>doc(path+"/"+(id||Math.random().toString(36).slice(2,12)+Date.now().toString(36))),
